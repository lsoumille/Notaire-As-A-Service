name = "notaire-as-a-service"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# This configuration allows you to test Cloudflare Pages Functions locally
# Run: npx wrangler pages dev dist

[env.production]
# Environment variables are set in Cloudflare Pages dashboard
# Required:
#   GEMINI_API_KEY - Your Google AI Studio API key
# Optional:
#   GEMINI_MODEL - Gemini model to use (default: gemini-3-flash-preview)
#                  Other options: gemini-1.5-pro, gemini-1.5-flash, gemini-2.0-flash-exp
#   ALLOWED_ORIGINS - Comma-separated list of allowed CORS origins (default: *)
